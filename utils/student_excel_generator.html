<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Excel Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#0070F0 0%,#0056C4 100%);min-height:100vh;padding:20px}.container{max-width:1400px;margin:0 auto;background:white;border-radius:12px;box-shadow:0 10px 30px rgba(0,112,240,0.2);overflow:hidden}.header{background:#0070F0;color:white;padding:30px;text-align:center}.header h1{font-size:2.5em;font-weight:300;margin-bottom:10px}.form-section{padding:30px;background:#f8f9fa;border-bottom:1px solid #eee}.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:20px}.form-group{display:flex;flex-direction:column}.form-group label{font-weight:600;color:#333;margin-bottom:8px;font-size:0.9em;text-transform:uppercase;letter-spacing:0.5px}.form-group input,.form-group select{padding:12px;border:2px solid #e1e5e9;border-radius:8px;font-size:16px;transition:all 0.3s ease}.form-group input:focus,.form-group select:focus{outline:none;border-color:#0070F0;box-shadow:0 0 0 3px rgba(0,112,240,0.1)}.students-section{padding:30px}.controls{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}.btn{background:#0070F0;color:white;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;transition:all 0.3s ease;text-transform:uppercase;letter-spacing:0.5px}.btn:hover{background:#0056C4;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,112,240,0.3)}.btn.secondary{background:#6c757d}.btn.secondary:hover{background:#545b62}.btn.success{background:#28a745}.btn.success:hover{background:#218838}.table-container{max-height:500px;overflow-y:auto;border:1px solid #dee2e6;border-radius:8px}table{width:100%;border-collapse:collapse;background:white}th{background:#0070F0;color:white;padding:15px 10px;text-align:left;font-weight:600;font-size:0.9em;text-transform:uppercase;letter-spacing:0.5px;position:sticky;top:0;z-index:10}td{padding:12px 10px;border-bottom:1px solid #dee2e6}tr:nth-child(even){background-color:#f8f9fa}tr:hover{background-color:#e3f2fd}.student-input{width:100%;padding:8px;border:1px solid #dee2e6;border-radius:4px;font-size:14px}.student-input:focus{outline:none;border-color:#0070F0}.delete-btn{background:#dc3545;color:white;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px}.delete-btn:hover{background:#c82333}.download-section{text-align:center;padding:30px;background:#f8f9fa}.alert{padding:15px;margin-bottom:20px;border-radius:8px;font-weight:500}.alert.success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}.alert.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}.student-count{background:#e3f2fd;color:#0070F0;padding:10px 20px;border-radius:25px;font-weight:600;display:inline-block;margin-bottom:20px}.code-generator{background:#fff3cd;border:1px solid #ffeaa7;border-radius:8px;padding:15px;margin-bottom:20px}.code-generator h3{color:#856404;margin-bottom:10px}.code-options{display:flex;gap:15px;align-items:center;flex-wrap:wrap}.code-options label{font-weight:500;color:#856404}.code-options input,.code-options select{padding:8px 12px;border:1px solid #ffeaa7;border-radius:4px;background:white}.access-code{font-family:'Courier New',monospace;font-weight:bold;background:#f8f9fa;padding:4px 8px;border-radius:4px;color:#0070F0}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>Student Excel Generator</h1>
<p>Create Excel files with students and access codes</p>
</div>
<div class="form-section">
<div class="form-row">
<div class="form-group">
<label>Institution</label>
<input type="text" id="institution" placeholder="e.g., CNMTV" value="CNMTV">
</div>
<div class="form-group">
<label>Academic Year</label>
<input type="number" id="year" placeholder="2025" value="2025" min="2020" max="2030">
</div>
</div>
<div class="code-generator">
<h3>Access Code Generation Settings</h3>
<div class="code-options">
<label>Code Format:</label>
<select id="codeFormat">
<option value="alphanumeric">Alphanumeric (A1B2C3)</option>
<option value="numeric">Numeric Only (123456)</option>
<option value="alpha">Letters Only (ABCDEF)</option>
<option value="mixed">Mixed Case (AbC123)</option>
</select>
<label>Code Length:</label>
<input type="number" id="codeLength" value="8" min="4" max="16">
</div>
</div>
</div>
<div class="students-section">
<div class="controls">
<button class="btn" onclick="addStudent()">Add Student</button>
<button class="btn secondary" onclick="generateSampleData()">Generate Sample Data</button>
<button class="btn secondary" onclick="clearAll()">Clear All</button>
<button class="btn success" onclick="downloadExcel()">Download Excel</button>
</div>
<div class="student-count">Students: <span id="studentCount">0</span></div>
<div class="table-container">
<table>
<thead>
<tr>
<th>Access Code</th>
<th>Name</th>
<th>Institution</th>
<th>Year</th>
<th>Photo URL</th>
<th>Height (cm)</th>
<th>Pluton</th>
<th>Rank</th>
<th>Action</th>
</tr>
</thead>
<tbody id="studentsTable"></tbody>
</table>
</div>
</div>
<div class="download-section">
<div id="alertContainer"></div>
<button class="btn success" onclick="downloadExcel()" style="font-size:18px;padding:15px 40px">📥 Download Excel File</button>
</div>
</div>
</div>
<script>
let students=[];let studentIdCounter=0;function generateAccessCode(){const format=document.getElementById('codeFormat').value;const length=parseInt(document.getElementById('codeLength').value)||8;let chars='';switch(format){case 'numeric':chars='0123456789';break;case 'alpha':chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ';break;case 'mixed':chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';break;default:chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'}let result='';for(let i=0;i<length;i++){result+=chars.charAt(Math.floor(Math.random()*chars.length))}const existingCodes=students.map(s=>s.accessCode);if(existingCodes.includes(result)){return generateAccessCode()}return result}function updateStudentCount(){document.getElementById('studentCount').textContent=students.length}function addStudent(){const institution=document.getElementById('institution').value||'CNMTV';const year=document.getElementById('year').value||'2025';const student={id:studentIdCounter++,accessCode:generateAccessCode(),name:'',institution:institution,year:year,photo:'',height:175,pluton:1,rank:0};students.push(student);renderTable();updateStudentCount()}function deleteStudent(id){students=students.filter(s=>s.id!==id);renderTable();updateStudentCount()}function updateStudent(id,field,value){const student=students.find(s=>s.id===id);if(student){student[field]=value}}function renderTable(){const tbody=document.getElementById('studentsTable');tbody.innerHTML='';students.forEach(student=>{const row=document.createElement('tr');row.innerHTML=`<td><span class="access-code">${student.accessCode}</span></td><td><input type="text" class="student-input" value="${student.name}" onchange="updateStudent(${student.id},'name',this.value)" placeholder="Full Name"></td><td><input type="text" class="student-input" value="${student.institution}" onchange="updateStudent(${student.id},'institution',this.value)" placeholder="CNMTV"></td><td><input type="number" class="student-input" value="${student.year}" onchange="updateStudent(${student.id},'year',this.value)" placeholder="2025" min="2020" max="2030"></td><td><input type="url" class="student-input" value="${student.photo}" onchange="updateStudent(${student.id},'photo',this.value)" placeholder="https://example.com/photo.jpg"></td><td><input type="number" class="student-input" value="${student.height}" onchange="updateStudent(${student.id},'height',parseInt(this.value))" placeholder="175" min="120" max="220"></td><td><input type="number" class="student-input" value="${student.pluton}" onchange="updateStudent(${student.id},'pluton',parseInt(this.value))" placeholder="1" min="1" max="10"></td><td><input type="number" class="student-input" value="${student.rank}" onchange="updateStudent(${student.id},'rank',parseInt(this.value))" placeholder="0" min="0" max="9"></td><td><button class="delete-btn" onclick="deleteStudent(${student.id})">Delete</button></td>`;tbody.appendChild(row)})}function generateSampleData(){const sampleNames=['Alexandru Popescu','Maria Ionescu','Andrei Georgescu','Elena Constantinescu','Mihai Dumitrescu','Ioana Marin','Cristian Popa','Ana Stoica','Gabriel Radu','Cristina Vlad','Stefan Preda','Diana Tudor','Florin Matei','Roxana Olteanu','Adrian Stancu','Bianca Niculescu'];const institution=document.getElementById('institution').value||'CNMTV';const year=document.getElementById('year').value||'2025';students=[];studentIdCounter=0;sampleNames.forEach((name,index)=>{const student={id:studentIdCounter++,accessCode:generateAccessCode(),name:name,institution:institution,year:year,photo:`https://example.com/photos/student${index+1}.jpg`,height:Math.floor(Math.random()*30)+160,pluton:Math.floor(Math.random()*4)+1,rank:Math.floor(Math.random()*6)};students.push(student)});renderTable();updateStudentCount();showAlert(`Generated ${sampleNames.length} sample students!`)}function clearAll(){if(confirm('Are you sure you want to clear all students?')){students=[];studentIdCounter=0;renderTable();updateStudentCount();showAlert('All students cleared!')}}function downloadExcel(){const institution=document.getElementById('institution').value||'CNMTV';const year=document.getElementById('year').value||'2025';if(students.length===0){showAlert('Please add at least one student before downloading!','error');return}const validStudents=students.filter(s=>s.name&&s.accessCode);if(validStudents.length===0){showAlert('Please fill in at least Name and Access Code for students!','error');return}const studentsData=[['Access Code','Name','Institution','Year','Photo','Height','Pluton','Rank']];validStudents.forEach(student=>{studentsData.push([student.accessCode,student.name,student.institution,student.year||year,student.photo||'',parseInt(student.height)||175,parseInt(student.pluton)||1,parseInt(student.rank)||0])});const workbook=XLSX.utils.book_new();const studentsSheet=XLSX.utils.aoa_to_sheet(studentsData);studentsSheet['!cols']=[{wch:15},{wch:20},{wch:15},{wch:10},{wch:40},{wch:10},{wch:10},{wch:10}];XLSX.utils.book_append_sheet(workbook,studentsSheet,'Students');const filename=`${institution}_Students_${year}.xlsx`;XLSX.writeFile(workbook,filename);showAlert(`Excel file "${filename}" downloaded with ${validStudents.length} students!`)}function showAlert(message,type='success'){const alertContainer=document.getElementById('alertContainer');const alert=document.createElement('div');alert.className=`alert ${type}`;alert.textContent=message;alertContainer.innerHTML='';alertContainer.appendChild(alert);setTimeout(()=>alert.remove(),5000)}renderTable();updateStudentCount();
</script>
</body>
</html>
